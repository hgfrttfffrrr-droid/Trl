name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip and Prepare Files
      run: |
        unzip Gaprom-GitHub.zip
        # ساخت پوشه‌های لازم
        mkdir -p Gaprom-GitHub/gradle/wrapper
        # ساخت فایل تنظیمات با نسخه ۸.۰
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip" > Gaprom-GitHub/gradle/wrapper/gradle-wrapper.properties

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        cd Gaprom-GitHub
        gradle wrapper

    - name: Build Debug APK
      run: |
        cd Gaprom-GitHub
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gaprom-Debug-APK
        path: Gaprom-GitHub/app/build/outputs/apk/debug/app-debug.apk
