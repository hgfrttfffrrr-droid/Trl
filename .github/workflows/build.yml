name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Source
      run: |
        unzip Gaprom-GitHub.zip
        # رفتن به داخل پوشه‌ای که باز شد
        cd Gaprom-GitHub
        # دانلود فایل‌های لازم برای بیلد (چون داخل زیپ نبودن)
        gradle wrapper

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        cd Gaprom-GitHub
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd Gaprom-GitHub
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gaprom-Debug-APK
        path: Gaprom-GitHub/app/build/outputs/apk/debug/app-debug.apk
