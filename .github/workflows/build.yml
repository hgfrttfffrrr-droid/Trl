name: Build Gaprom APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Gaprom-GitHub*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -o "$ZIP_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          cd Gaprom-GitHub
          gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp Gaprom-GitHub/app/build/outputs/apk/debug/app-debug.apk output/Gaprom-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaprom-APK
          path: output/Gaprom-APK.apk
          if-no-files-found: error
