name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Source
      run: |
        unzip Gaprom-GitHub.zip
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # این خط اضافه شد تا بره داخل پوشه اصلی پروژه
    - name: Enter Project Directory
      run: cd Gaprom-GitHub || cd $(ls -d */ | grep -v ".github" | head -n 1)

    - name: Grant execute permission for gradlew
      run: |
        cd Gaprom-GitHub || cd $(ls -d */ | grep -v ".github" | head -n 1)
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd Gaprom-GitHub || cd $(ls -d */ | grep -v ".github" | head -n 1)
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gaprom-Debug-APK
        # مسیر فایل apk رو هم اصلاح کردم که از داخل پوشه پیدا بشه
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
