name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip and Find Project Directory
      run: |
        unzip Gaprom-GitHub.zip
        # پیدا کردن پوشه‌ای که فایل gradlew داخلش هست و ذخیره مسیرش توی یک متغیر
        PROJECT_DIR=$(dirname $(find . -name "gradlew" -type f | head -n 1))
        echo "Project found in: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      working-directory: ${{ env.PROJECT_DIR }}
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: ${{ env.PROJECT_DIR }}
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gaprom-Debug-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
